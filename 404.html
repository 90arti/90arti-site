    <style>
      body.dl90{display:flex;flex-direction:column}
      body.dl90 #root{height:auto;flex:1;min-height:0}
      #dl90{display:none;flex:none;align-items:center;gap:10px;padding:8px 10px 8px 6px;background:#0B1B2D;border-bottom:1px solid #22344a;font-family:Roboto,system-ui,sans-serif;text-decoration:none}
      body.dl90 #dl90{display:flex}
      #dl90 .x{color:#8a97a8;font-size:22px;line-height:1;padding:6px;background:none;border:0;cursor:pointer}
      #dl90 img{width:42px;height:42px;border-radius:10px}
      #dl90 .t{flex:1;min-width:0}
      #dl90 .t b{display:block;color:#fff;font-weight:700;font-size:14.5px}
      #dl90 .t span{display:block;color:#b9c4d2;font-size:12px;margin-top:2px}
      #dl90 .go{background:#FF2D3D;color:#fff;font-weight:800;font-size:13px;padding:9px 16px;border-radius:18px;text-decoration:none;white-space:nowrap}
    </style>
    <div id="dl90"><button class="x" aria-label="Kapat">×</button><img src="/img/icon-192.png" alt=""><div class="t"><b>90Artı uygulaması</b><span>Android ve iPhone · Ücretsiz</span></div><a class="go" href="/indir?k=serit">İNDİR</a></div>
    <script>
      (function(){try{
        var ua=navigator.userAgent||'', mob=/Android|iPhone|iPad|iPod/i.test(ua);
        var app=(window.matchMedia&&matchMedia('(display-mode: standalone)').matches)||navigator.standalone;
        var t=0,g=0; try{t=+localStorage.getItem('90a-dl-x')||0;g=+localStorage.getItem('90a-dl-go')||0}catch(e){}
        // İNDİR'e basan telefon uygulamayı kurmuş sayılır: 60 gün gösterme (tarayıcı kurulu uygulamayı göremiyor)
        if(!mob||app||Date.now()-t<864e5||Date.now()-g<60*864e5)return;
        document.body.classList.add('dl90');
        var go=document.querySelector('#dl90 .go');
        // Android: uygulama kuruluysa aynı sayfayı uygulamada açar (doksanarti://…), değilse Play'e (/indir sayar ve yönlendirir) — 23 Kasım 2026, kullanıcı
        if(/Android/i.test(ua)) go.href='intent://'+location.pathname.replace(/^\//,'')+'#Intent;scheme=doksanarti;package=com.doksanarti.app;S.browser_fallback_url='+encodeURIComponent(location.origin+'/indir?k=serit')+';end';
        go.onclick=function(){try{localStorage.setItem('90a-dl-go',''+Date.now())}catch(e){}};
        document.querySelector('#dl90 .x').onclick=function(){document.body.classList.remove('dl90');try{localStorage.setItem('90a-dl-x',''+Date.now())}catch(e){}};
      }catch(e){}})();
    </script>
