<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>90Artı'yı İndir – Canlı Skor ve Analiz</title>
<meta name="description" content="90Artı'yı ücretsiz indir: canlı skor, anlık gol bildirimi, maç analizi, puan durumu ve maç özetleri. iPhone ve Android.">
<link rel="icon" type="image/png" href="/img/favicon.png">
<link rel="apple-touch-icon" href="/img/icon-192.png">
<meta name="theme-color" content="#0B1B2D">
<meta property="og:title" content="90Artı'yı İndir – Canlı Skor ve Analiz">
<meta property="og:description" content="Canlı skor, anlık gol bildirimi, maç analizi, puan durumu ve maç özetleri. Ücretsiz.">
<meta property="og:image" content="https://90arti.tr/img/icon-192.png">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:#0B1B2D;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;min-height:100%}
  body{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:32px 16px}
  .box{width:100%;max-width:420px;text-align:center}
  .logo{width:112px;height:112px;border-radius:26px;box-shadow:0 10px 30px rgba(0,0,0,.4)}
  h1{font-size:26px;font-weight:800;margin:20px 0 6px}
  .sub{color:#8FA4BA;font-size:15px;line-height:1.45}
  ul{list-style:none;text-align:left;margin:22px auto 26px;max-width:320px;display:grid;gap:9px;font-size:15px;color:#DCE5EE}
  ul li span{display:inline-block;width:26px}
  .btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;height:56px;border-radius:14px;font-size:17px;font-weight:700;text-decoration:none;margin-bottom:12px;border:1px solid #2A4562;background:#13263C;color:#fff}
  .btn small{display:block;font-size:11px;font-weight:600;color:#8FA4BA;line-height:1}
  .btn .t{text-align:left;line-height:1.15}
  .btn svg{width:24px;height:24px;flex:none}
  .btn.off{opacity:.55;pointer-events:none}
  .btn.web{background:#FF2D3D;border-color:#FF2D3D}
  .btn.hi{border-color:#FF2D3D}
  .note{color:#8FA4BA;font-size:12.5px;margin-top:10px;line-height:1.5}
</style>
</head>
<body>
<main class="box">
  <img class="logo" src="/img/icon-192.png" alt="90Artı">
  <h1>90Artı</h1>
  <p class="sub">Canlı Skor ve Analiz · Ücretsiz</p>
  <ul>
    <li><span>⚽</span>Canlı skor ve anlık gol bildirimi</li>
    <li><span>📊</span>Maç analizi, puan durumu, istatistik</li>
    <li><span>▶️</span>Maç özetleri uygulamanın içinde</li>
    <li><span>🏀</span>Basketbol ve voleybol da burada</li>
  </ul>

  <a id="ios" class="btn" href="#">
    <svg viewBox="0 0 24 24" fill="#fff"><path d="M16.4 12.6c0-2.4 2-3.6 2.1-3.7-1.1-1.7-2.9-1.9-3.5-1.9-1.5-.2-2.9.9-3.7.9s-1.9-.9-3.2-.8c-1.6 0-3.1 1-4 2.4-1.7 3-.4 7.4 1.2 9.8.8 1.2 1.8 2.5 3 2.4 1.2 0 1.7-.8 3.1-.8s1.9.8 3.2.8 2.1-1.2 2.9-2.4c.9-1.4 1.3-2.7 1.3-2.8-.1 0-2.4-.9-2.4-3.9zM14 5.5c.7-.8 1.1-1.9 1-3-1 0-2.1.7-2.8 1.5-.6.7-1.2 1.8-1 2.9 1.1.1 2.1-.6 2.8-1.4z"/></svg>
    <span class="t"><small id="iosS">İndir</small>App Store</span>
  </a>
  <a id="and" class="btn" href="#">
    <svg viewBox="0 0 24 24"><path fill="#34A853" d="M3.6 2.3 13.5 12l-9.9 9.7c-.4-.2-.6-.7-.6-1.2V3.5c0-.5.2-1 .6-1.2z"/><path fill="#FBBC04" d="m17 15.5-3.5-3.5L17 8.5l4 2.3c1.1.6 1.1 1.8 0 2.4z"/><path fill="#EA4335" d="M17 15.5 13.5 12l-9.9 9.7c.4.2.9.2 1.4-.1z"/><path fill="#4285F4" d="M17 8.5 5 2.4c-.5-.3-1-.3-1.4-.1l9.9 9.7z"/></svg>
    <span class="t"><small id="andS">İndir</small>Google Play</span>
  </a>
  <a class="btn web" href="/">Web'de hemen kullan</a>
  <p class="note" id="note"></p>
</main>
<script>
  // Mağaza durumu: yayına girince true yap (90Artı, 4 Kasım 2026).
  var IOS_LIVE = true, AND_LIVE = false;
  var IOS_URL = 'https://apps.apple.com/tr/app/id6830647151';
  var AND_URL = 'https://play.google.com/store/apps/details?id=com.doksanarti.app';
  var ua = navigator.userAgent || '';
  var isIOS = /iPhone|iPad|iPod/.test(ua) || (/Macintosh/.test(ua) && 'ontouchend' in document);
  var isAnd = /Android/.test(ua);
  function set(id, live, url) {
    var a = document.getElementById(id), s = document.getElementById(id + 'S');
    if (live) { a.href = url; s.textContent = 'İndir'; }
    else { a.classList.add('off'); a.removeAttribute('href'); s.textContent = 'Çok yakında'; }
  }
  set('ios', IOS_LIVE, IOS_URL); set('and', AND_LIVE, AND_URL);
  if (isIOS && IOS_LIVE) location.replace(IOS_URL);
  else if (isAnd && AND_LIVE) location.replace(AND_URL);
  else {
    if (isIOS) document.getElementById('ios').classList.add('hi');
    if (isAnd) document.getElementById('and').classList.add('hi');
    if (!IOS_LIVE || !AND_LIVE) document.getElementById('note').textContent = 'Uygulama çok yakında mağazalarda. Şimdilik bütün özellikleri web\'de kullanabilirsin.';
  }
</script>
</body>
</html>
